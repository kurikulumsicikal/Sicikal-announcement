<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1CIKAL ANNOUNCEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --biru-muda: #0ea5e9;
            --biru-terang: #38bdf8;
            --bg-biru: #f0f9ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-biru);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.15);
            overflow: hidden;
            border: 1px solid #e0f2fe;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, var(--biru-muda), var(--biru-terang));
            padding: 40px 20px;
            color: white;
        }

        .header img {
            width: 80px;
            background: white;
            padding: 10px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        /* NAMA SEKOLAH BESAR */
        .nama-sekolah {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .judul-hasil {
            font-size: 26px;
            font-weight: 800;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
        }

        .tahun-ajaran {
            font-size: 15px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }

        button.btn-cari {
            width: 100%;
            background-color: var(--biru-muda);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
        }

        #hasil {
            margin-top: 25px;
            display: none;
            text-align: left;
            padding: 20px;
            background: #f8fafc;
            border-radius: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 5px;
        }

        /* WARNA STATUS BERBEDA */
        .status-box {
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            font-weight: 800;
            margin-top: 15px;
            font-size: 18px;
        }

        /* Jika LULUS/ELIGIBLE -> Hijau */
        .warna-hijau { background: #dcfce7; color: #166534; border: 2px solid #bbf7d0; }
        
        /* Jika TIDAK -> Merah */
        .warna-merah { background: #fee2e2; color: #991b1b; border: 2px solid #fecdd3; }

        .footer {
            padding: 20px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo">
        <div class="nama-sekolah">SMAN 1 CIKALONGWETAN</div>
        <div class="judul-hasil">HASIL ELIGIBLE</div>
        <div class="tahun-ajaran">Tahun Ajaran 2025/2026</div>
    </div>

    <div class="content">
        <input type="text" id="nisn" placeholder="Masukkan NISN Siswa" maxlength="10">
        <button class="btn-cari" onclick="cekData()">CEK DATA SEKARANG</button>

        <div id="hasil"></div>
    </div>

    <div class="footer">Sistem Informasi Pengumuman Sekolah &copy; 2026</div>
</div>

<script>
    async function cekData() {
        const nisn = document.getElementById('nisn').value;
        const resDiv = document.getElementById('hasil');
        
        // PENTING: Masukkan URL Apps Script Anda di sini
        const url = "TEMPEL_URL_WEB_APP_ANDA_DISINI";

        if (!nisn) { alert("Isi NISN dulu!"); return; }

        resDiv.style.display = "block";
        resDiv.innerHTML = "<p style='text-align:center;'>Mengecek data...</p>";

        try {
            const r = await fetch(url + "?nisn=" + nisn);
            const d = await r.json();

            if (d.status === "DITEMUKAN") {
                const ket = d.keterangan.toUpperCase().trim(); // Membaca teks dan hapus spasi berlebih
                
                // LOGIKA TERBALIK:
                // Hanya kata "ELIGIBLE" yang dapat warna HIJAU. 
                // Semua tulisan lain selain itu otomatis MERAH.
                let warnaKelas = "warna-merah"; 
                
                if (ket === "ELIGIBLE") {
                    warnaKelas = "warna-hijau";
                }

                resDiv.innerHTML = `
                    <div class="info-row"><span>Nama:</span><b>${d.nama}</b></div>
                    <div class="info-row"><span>Kelas:</span><b>${d.kelas}</b></div>
                    <div class="status-box ${warnaKelas}">
                        ${d.keterangan}
                    </div>
                    <button onclick="window.print()" style="width:100%; margin-top:15px; cursor:pointer; padding:10px; border-radius:10px; border:1px solid #ccc; background:white; font-family:'Poppins';">CETAK HASIL</button>
                `;
            } else {
                resDiv.innerHTML = "<p style='color:red; text-align:center; font-weight:bold;'>Data NISN tidak ditemukan!</p>";
            }
        } catch (e) {
            resDiv.innerHTML = "<p style='text-align:center;'>Gagal memuat data.</p>";
        }
    }
</script>

</body>
</html>
