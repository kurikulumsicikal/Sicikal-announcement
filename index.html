<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASIL SELEKSI 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; /* Warna Biru Modern */
            --secondary: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            border: 1px solid white;
        }

        .header img {
            width: 90px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--secondary);
            margin-top: 5px;
        }

        .input-group {
            margin: 30px 0 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--secondary);
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            outline: none;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        #hasil {
            margin-top: 30px;
            display: none;
            padding: 20px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid #f3f4f6;
            text-align: left;
            animation: slideUp 0.4s ease-out;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #f1f5f9;
        }

        .result-item:last-child { border: none; }
        .label { font-size: 13px; color: var(--secondary); }
        .value { font-size: 14px; font-weight: 600; }

        .status-badge {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }

        .eligible { background: #dcfce7; color: #166534; }
        .tidak { background: #fee2e2; color: #991b1b; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo Sekolah">
        <h1>HASIL ELIGIBLE</h1>
        <p>Tahun Pelajaran 2025/2026</p>
    </div>

    <div class="input-group">
        <label for="nisn">Nomor Induk Siswa Nasional</label>
        <input type="text" id="nisn" placeholder="Contoh: 0081234567" maxlength="10">
    </div>

    <button onclick="cekData()">Periksa Status</button>

    <div id="hasil"></div>

    <div class="footer">
        Portal Pengumuman Resmi &copy; 2026
    </div>
</div>

<script>
    async function cekData() {
        const nisn = document.getElementById('nisn').value;
        const resultDiv = document.getElementById('hasil');
        
        // --- MASUKKAN URL WEB APP ANDA DI SINI ---
        const url = "https://script.google.com/macros/s/AKfycbwjaypkVDJXbzYyM7KVN3Ms4BNqm_WwMKLM0EO_m12_XUslYiuf3xnYezLwi9mmBLEm/exec";

        if (!nisn) {
            alert("Masukkan NISN terlebih dahulu!");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.innerHTML = "<p style='text-align:center; font-size:14px;'>⏳ Memvalidasi data...</p>";

        try {
            const res = await fetch(`${url}?nisn=${nisn}`);
            const data = await res.json();

            if (data.status === "DITEMUKAN") {
                const isOk = data.keterangan.toUpperCase() === "ELIGIBLE";
                resultDiv.innerHTML = `
                    <div class="result-item"><span class="label">Nama Lengkap</span><span class="value">${data.nama}</span></div>
                    <div class="result-item"><span class="label">Kelas</span><span class="value">${data.kelas}</span></div>
                    <div class="status-badge ${isOk ? 'eligible' : 'tidak'}">
                        ${isOk ? '🎉 ' + data.keterangan : '❌ ' + data.keterangan}
                    </div>
                    <button onclick="window.print()" style="margin-top:15px; background:#64748b; font-size:12px; padding:8px;">Cetak Hasil</button>
                `;
            } else {
                resultDiv.innerHTML = "<p style='color:red; text-align:center; font-size:13px;'>Data tidak ditemukan. Pastikan NISN benar.</p>";
            }
        } catch (e) {
            resultDiv.innerHTML = "<p style='color:red; text-align:center; font-size:13px;'>Terjadi gangguan koneksi.</p>";
        }
    }
</script>

</body>
</html>
