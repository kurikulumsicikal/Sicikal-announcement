<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1CIKAL ANNOUNCEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9; /* Biru Muda Cerah */
            --bg-body: #f0f9ff; /* Background Biru Sangat Muda */
            --text-dark: #0c4a6e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.1);
            overflow: hidden;
            border: 1px solid #e0f2fe;
        }

        .header {
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            padding: 40px 20px;
            color: white;
            text-align: center;
        }

        .header img {
            width: 85px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            margin-bottom: 15px;
            background: white;
            padding: 8px;
            border-radius: 50%;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 13px;
            margin: 5px 0 0;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        .input-wrapper label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #64748b;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            outline: none;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
        }

        button:hover {
            background-color: #0284c7;
            transform: translateY(-1px);
        }

        #hasil {
            margin-top: 30px;
            display: none;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            animation: fadeIn 0.5s ease;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-item .label { color: #64748b; }
        .info-item .value { font-weight: 600; color: #0f172a; }

        .status-pill {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .eligible { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .not-eligible { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <img src="logo.png" alt="Logo Sekolah">
        <h1>SMAN 1 CIKALONGWETAN</h1>
        <p>Tahun Pelajaran 2025/2026</p>
    </div>

    <div class="content">
        <div class="input-wrapper">
            <label>Masukkan NISN Siswa</label>
            <input type="text" id="nisn" placeholder="Contoh: 0081234567" maxlength="10">
        </div>
        
        <button onclick="prosesCek()">LIHAT HASIL</button>

        <div id="hasil"></div>
    </div>

    <div class="footer">
        &copy; 2026 Sistem Pengumuman Digital
    </div>
</div>

<script>
    async function prosesCek() {
        const nisnInput = document.getElementById('nisn').value;
        const resDiv = document.getElementById('hasil');
        
        // --- TEMPEL URL GOOGLE APPS SCRIPT ANDA DI SINI ---
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwjaypkVDJXbzYyM7KVN3Ms4BNqm_WwMKLM0EO_m12_XUslYiuf3xnYezLwi9mmBLEm/exec";

        if (!nisnInput) {
            alert("Harap isi NISN!");
            return;
        }

        resDiv.style.display = "block";
        resDiv.innerHTML = "<p style='text-align:center; font-size:14px; color:#64748b;'>🔍 Mencari data di server...</p>";

        try {
            const response = await fetch(`${scriptUrl}?nisn=${nisnInput}`);
            const data = await response.json();

            if (data.status === "DITEMUKAN") {
                const isLulus = data.keterangan.toUpperCase() === "ELIGIBLE" || data.keterangan.toUpperCase() === "LULUS";
                
                resDiv.innerHTML = `
                    <div class="info-item"><span class="label">Nama Siswa</span><span class="value">${data.nama}</span></div>
                    <div class="info-item"><span class="label">Kelas</span><span class="value">${data.kelas}</span></div>
                    <div class="status-pill ${isLulus ? 'eligible' : 'not-eligible'}">
                        ${data.keterangan}
                    </div>
                    <button onclick="window.print()" style="margin-top:15px; background:#f1f5f9; color:#475569; font-size:12px; box-shadow:none;">CETAK PDF / PRINT</button>
                `;
            } else {
                resDiv.innerHTML = "<p style='color:#e11d48; text-align:center; font-size:14px; font-weight:600;'>❌ NISN tidak ditemukan!</p>";
            }
        } catch (error) {
            resDiv.innerHTML = "<p style='color:#e11d48; text-align:center; font-size:14px;'>⚠️ Gangguan koneksi, coba lagi.</p>";
        }
    }
</script>

</body>
</html>
