<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1CIKAL ANNOUNCEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --biru: #0ea5e9; --bg: #f0f9ff; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 90%; max-width: 450px; border-radius: 30px; box-shadow: 0 20px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; border: 1px solid #e0f2fe; }
        .header { background: linear-gradient(135deg, #0ea5e9, #38bdf8); padding: 40px 20px; color: white; }
        .header img { width: 80px; background: white; padding: 10px; border-radius: 50%; margin-bottom: 15px; }
        .nama-sekolah { font-size: 22px; font-weight: 800; text-transform: uppercase; margin: 0; }
        .judul-hasil { font-size: 26px; font-weight: 800; margin: 10px 0; }
        .content { padding: 30px; }
        input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; text-align: center; }
        button { width: 100%; background: var(--biru); color: white; padding: 16px; border: none; border-radius: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
        #hasil { margin-top: 25px; display: none; text-align: left; padding: 20px; background: #f8fafc; border-radius: 20px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .status-box { text-align: center; padding: 15px; border-radius: 15px; font-weight: 800; margin-top: 15px; font-size: 18px; text-transform: uppercase; }
        /* Warna Status */
        .warna-hijau { background: #dcfce7 !important; color: #166534 !important; border: 2px solid #bbf7d0; }
        .warna-merah { background: #fee2e2 !important; color: #991b1b !important; border: 2px solid #fecdd3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo">
        <div class="nama-sekolah">SMAN 1 CIKALONGWETAN</div>
        <div class="judul-hasil">HASIL ELIGIBLE</div>
        <div class="tahun-ajaran">Tahun Ajaran 2025/2026</div>
    </div>
    <div class="content">
        <input type="text" id="nisn" placeholder="Masukkan NISN Siswa">
        <button onclick="cekData()">HASIL</button>
        <div id="hasil"></div>
    </div>
</div>

<script>
    async function cekData() {
        const nisn = document.getElementById('nisn').value;
        const resDiv = document.getElementById('hasil');
        
        // GANTI LINK DI BAWAH INI DENGAN LINK /exec ANDA
        const url = "https://script.google.com/macros/s/AKfycbwjaypkVDJXbzYyM7KVN3Ms4BNqm_WwMKLM0EO_m12_XUslYiuf3xnYezLwi9mmBLEm/exec";

        if (!nisn) { alert("Isi NISN dulu!"); return; }

        resDiv.style.display = "block";
        resDiv.innerHTML = "Mencari data...";

        try {
            const r = await fetch(url + "?nisn=" + nisn);
            const d = await r.json();

            if (d.status === "DITEMUKAN") {
                // LOGIKA: Ambil teks, jadikan huruf besar, hapus spasi
                const ket = (d.keterangan || "").toUpperCase().trim();
                
                // Secara default MERAH
                let warnaKelas = "warna-merah"; 
                
                // HANYA jika tulisannya persis ELIGIBLE maka jadi HIJAU
                if (ket === "ELIGIBLE") {
                    warnaKelas = "warna-hijau";
                }

                resDiv.innerHTML = `
                    <div class="info-row"><span>Nama:</span><b>${d.nama}</b></div>
                    <div class="info-row"><span>Kelas:</span><b>${d.kelas}</b></div>
                    <div class="status-box ${warnaKelas}">
                        ${d.keterangan}
                    </div>
                `;
            } else {
                resDiv.innerHTML = "<p style='color:red; text-align:center;'>Data tidak ditemukan!</p>";
            }
        } catch (e) {
            resDiv.innerHTML = "<p style='color:red; text-align:center;'>Gagal memuat data. Cek URL Script Anda.</p>";
        }
    }
</script>

</body>
</html>
