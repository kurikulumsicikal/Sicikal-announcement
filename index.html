<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICIKAL ANNOUNCEMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --biru-muda: #0ea5e9;
            --biru-terang: #38bdf8;
            --bg-biru: #f0f9ff;
            --teks-gelap: #0c4a6e;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-biru);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--teks-gelap);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.1);
            overflow: hidden;
            border: 1px solid #e0f2fe;
            text-align: center;
        }

        /* HEADER SECTION */
        .header {
            background: linear-gradient(135deg, var(--biru-muda), var(--biru-terang));
            padding: 40px 20px;
            color: white;
        }

        .header img {
            width: 80px;
            height: auto;
            background: white;
            padding: 10px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 14px;
            font-weight: 400;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }

        .header .judul-utama {
            font-size: 24px;
            font-weight: 800;
            margin: 10px 0 2px 0;
            letter-spacing: 1px;
        }

        .header .tahun-ajaran {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
        }

        /* FORM SECTION */
        .content {
            padding: 35px 25px;
        }

        .label-input {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: left;
            color: #64748b;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: 0.3s;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--biru-muda);
            outline: none;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        button.btn-cari {
            width: 100%;
            background-color: var(--biru-muda);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
        }

        button.btn-cari:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
        }

        /* RESULT SECTION */
        #hasil {
            margin-top: 30px;
            display: none;
            text-align: left;
            animation: slideUp 0.4s ease-out;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 8px;
        }

        .info-label { font-size: 13px; color: #64748b; }
        .info-value { font-size: 14px; font-weight: 600; color: #1e293b; }

        .status-box {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            margin-top: 20px;
            font-size: 18px;
            text-transform: uppercase;
        }

        .LULUS { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .TIDAK { background: #fee2e2; color: #991b1b; border: 1px solid #fecdd3; }

        .footer {
            padding: 25px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo Sekolah">
        
        <h1>SMAN 1 CIKALONGWETAN</h1>
        <div class="judul-utama">HASIL ELIGIBLE</div>
        <div class="tahun-ajaran">Tahun Ajaran 2025/2026</div>
    </div>

    <div class="content">
        <label class="label-input">Masukkan NISN Siswa</label>
        <input type="text" id="nisn" placeholder="Contoh: 0081234567" maxlength="10">
        
        <button class="btn-cari" onclick="cekData()">LIHAT HASIL</button>

        <div id="hasil"></div>
    </div>

    <div class="footer">
        &copy; 2026 Sistem Pengumuman Digital Sekolah
    </div>
</div>

<script>
    async function cekData() {
        const nisn = document.getElementById('nisn').value;
        const display = document.getElementById('hasil');
        
        // PENTING: Ganti URL di bawah ini dengan URL Apps Script Anda
        const webAppUrl = "https://script.google.com/macros/s/AKfycbwjaypkVDJXbzYyM7KVN3Ms4BNqm_WwMKLM0EO_m12_XUslYiuf3xnYezLwi9mmBLEm/exec";

        if (!nisn) {
            alert("Harap masukkan NISN terlebih dahulu!");
            return;
        }

        display.style.display = "block";
        display.innerHTML = "<p style='text-align:center; color:#64748b;'>Memeriksa basis data...</p>";

        try {
            const response = await fetch(`${webAppUrl}?nisn=${nisn}`);
            const data = await response.json();

            if (data.status === "DITEMUKAN") {
                const ket = data.keterangan.toUpperCase();
                const isEligible = ket.includes("ELIGIBLE") || ket.includes("LULUS") || ket.includes("LOLOS");
                
                display.innerHTML = `
                    <div class="info-row"><span class="info-label">Nama</span><span class="info-value">${data.nama}</span></div>
                    <div class="info-row"><span class="info-label">Kelas</span><span class="info-value">${data.kelas}</span></div>
                    <div class="status-box ${isEligible ? 'LULUS' : 'TIDAK'}">
                        ${data.keterangan}
                    </div>
                    <button onclick="window.print()" style="width:100%; margin-top:15px; background:white; border:1px solid #cbd5e1; padding:8px; border-radius:10px; font-size:12px; cursor:pointer; font-family:'Poppins';">CETAK HASIL</button>
                `;
            } else {
                display.innerHTML = "<p style='color:#ef4444; text-align:center; font-weight:600;'>Data tidak ditemukan. Periksa kembali NISN Anda.</p>";
            }
        } catch (error) {
            display.innerHTML = "<p style='color:#ef4444; text-align:center;'>Gagal terhubung ke server. Pastikan URL Apps Script benar.</p>";
        }
    }
</script>

</body>
</html>
